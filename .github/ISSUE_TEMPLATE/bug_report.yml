name: Bug report
description: Report reproducible On-call Forms behavior
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, or sensitive form content.
  - type: input
    id: glpi
    attributes:
      label: GLPI version
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
