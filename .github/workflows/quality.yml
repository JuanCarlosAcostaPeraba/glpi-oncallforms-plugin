name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/js/oncallforms.js

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/package.sh
      - run: test -f build/oncallforms-1.0.7.zip
      - run: unzip -l build/oncallforms-1.0.7.zip | grep 'oncallforms/setup.php'
      - run: unzip -l build/oncallforms-1.0.7.zip | grep 'oncallforms/public/js/oncallforms.js'
      - run: unzip -l build/oncallforms-1.0.7.zip | grep 'oncallforms/public/css/oncallforms.css'
      - run: '! unzip -l build/oncallforms-1.0.7.zip | grep -E "(^|/)tests/|(^|/)vendor/|\.git"'
