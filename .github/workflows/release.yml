name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.0.0-rc.1)
        required: true
        default: v1.0.0-rc.1
        type: string
      prerelease:
        description: Publish as a GitHub prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check js/oncallforms.js

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and validate release metadata
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${DISPATCH_TAG}"
            prerelease="${DISPATCH_PRERELEASE}"
          else
            tag="${GITHUB_REF_NAME}"
            if [[ "${tag}" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
          fi

          version="$(php -r "require 'setup.php'; echo PLUGIN_ONCALLFORMS_VERSION;")"
          if [[ "${tag}" != "v${version}" && "${tag}" != "v${version}-"* ]]; then
            echo "Tag ${tag} does not match plugin version ${version}." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Build release archive
        run: |
          bash tools/package.sh
          cd build
          sha256sum ./*.zip > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/*.zip
            build/SHA256SUMS
